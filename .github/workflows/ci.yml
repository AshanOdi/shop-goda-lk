# Runs on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres for this run, like compose.yaml locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apekade
          POSTGRES_PASSWORD: apekade
          POSTGRES_DB: apekade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apekade -d apekade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values. Real secrets never go in this file.
    env:
      DATABASE_URL: postgres://apekade:apekade@localhost:5432/apekade
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format and unit tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
